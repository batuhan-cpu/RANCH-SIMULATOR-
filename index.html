<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İyi Ki Doğdun!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #050515 0%, #101432 60%, #1a1b35 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Arka Plan Yıldızlar */
    .stars {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 40px 70px, #ffffffa6, rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0));
      background-size: 200px 200px;
      animation: twinkle 4s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Dağ Silüeti */
    .mountains {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 250px;
      background: linear-gradient(to top, #020208 20%, transparent 100%);
      clip-path: polygon(0% 100%, 15% 40%, 35% 80%, 50% 20%, 65% 70%, 85% 30%, 100% 100%);
      z-index: 1;
    }

    /* Mektup Konteynırı */
    .container {
      position: relative;
      z-index: 10;
      cursor: pointer;
    }

    /* Kalp Zarf Tasarımı */
    .envelope {
      width: 160px;
      height: 140px;
      background: #e63946;
      position: relative;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(230, 57, 70, 0.4);
      transition: transform 0.3s ease;
      animation: float 3s ease-in-out infinite;
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Kalp Mührü */
    .heart-seal {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
      width: 40px;
      height: 40px;
      background: #ff758f;
      z-index: 3;
      transition: opacity 0.4s ease;
    }

    .heart-seal::before, .heart-seal::after {
      content: '';
      width: 40px;
      height: 40px;
      background: #ff758f;
      border-radius: 50%;
      position: absolute;
    }

    .heart-seal::before { top: -20px; left: 0; }
    .heart-seal::after { left: 20px; top: 0; }

    /* Zarf Kapakları */
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      border-left: 80px solid transparent;
      border-right: 80px solid transparent;
      border-top: 75px solid #d62828;
      transform-origin: top;
      transition: transform 0.6s ease;
      z-index: 2;
    }

    /* İçinden Çıkan Kağıt */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 0;
      background: #fffdf9;
      border-radius: 8px;
      padding: 0 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      overflow: hidden;
      transition: height 0.8s ease 0.4s, bottom 0.8s ease 0.4s, padding 0.4s ease 0.4s;
      z-index: 1;
      text-align: center;
      color: #333;
    }

    /* Açılma Animasyon Sınıfları */
    .container.open .envelope::before {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .container.open .heart-seal {
      opacity: 0;
    }

    .container.open .letter {
      height: 280px;
      bottom: -60px;
      padding: 25px 20px;
      z-index: 5;
    }

    .letter h2 {
      color: #e63946;
      font-size: 20px;
      margin-bottom: 12px;
    }

    .letter p {
      font-size: 14px;
      line-height: 1.5;
      color: #4a4a4a;
    }
  </style>
</head>
<body>

  <div class="stars"></div>
  <div class="mountains"></div>

  <div class="container" onclick="openLetter()">
    <div class="envelope">
      <div class="heart-seal"></div>
    </div>
    <div class="letter">
      <h2>İyi Ki Doğdun! ❤️</h2>
      <p>
        Dünyanın en yüksek zirvesinde, yıldızların tam altında seninle olmak gibiydi seni tanımak... <br><br>
        Yeni yaşın sana tüm güzellikleri, mutluluğu ve huzuru getirsin. Doğum günün kutlu olsun!
      </p>
    </div>
  </div>

  <script>
    function openLetter() {
      const container = document.querySelector('.container');
      container.classList.toggle('open');
    }
  </script>

</body>
</html>
